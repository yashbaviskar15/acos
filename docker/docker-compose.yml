name: aravanta-cloudos

x-backend-service: &backend-service
  build:
    context: ..
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  networks:
    - aravanta
  environment:
    ARVGATE_JWT_SECRET_KEY: ${ARVGATE_JWT_SECRET_KEY:-aravanta_dev_jwt_secret_change_me}
    JWT_SECRET_KEY: ${ARVGATE_JWT_SECRET_KEY:-aravanta_dev_jwt_secret_change_me}
    JWT_ALGORITHM: HS256
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  depends_on:
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aravanta
      POSTGRES_PASSWORD: aravanta_password
      POSTGRES_DB: aravanta_identity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aravanta -d aravanta_identity"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aravanta

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aravanta

  arvgate:
    <<: *backend-service
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: arvgate
    environment:
      ARVGATE_DATABASE_URL: postgresql://aravanta:aravanta_password@postgres:5432/aravanta_identity
      ARVGATE_REDIS_URL: redis://redis:6379/0
      ARVGATE_JWT_SECRET_KEY: ${ARVGATE_JWT_SECRET_KEY:-aravanta_dev_jwt_secret_change_me}
      JWT_SECRET_KEY: ${ARVGATE_JWT_SECRET_KEY:-aravanta_dev_jwt_secret_change_me}
      JWT_ALGORITHM: HS256
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"

  arvcompute:
    <<: *backend-service
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: arvcompute
    ports:
      - "8002:8000"

  arvkube:
    <<: *backend-service
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: arvkube
    ports:
      - "8003:8000"

  arvstore:
    <<: *backend-service
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: arvstore
    ports:
      - "8004:8000"

  arvdb:
    <<: *backend-service
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: arvdb
    ports:
      - "8005:8000"

  arvregistry:
    <<: *backend-service
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: arvregistry
    ports:
      - "8006:8000"

  arvedge:
    <<: *backend-service
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: arvedge
    ports:
      - "8007:8000"

  arvwatch:
    <<: *backend-service
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: arvwatch
    ports:
      - "8008:8000"

  arvcicd:
    <<: *backend-service
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: arvcicd
    ports:
      - "8009:8000"

  arvbilling:
    <<: *backend-service
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: arvbilling
    ports:
      - "8010:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - aravanta

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - arvgate
      - arvcompute
      - arvkube
      - arvstore
      - arvdb
      - arvregistry
      - arvedge
      - arvwatch
      - arvcicd
      - arvbilling
      - frontend
    networks:
      - aravanta

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager
    networks:
      - aravanta

  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - aravanta

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ../monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"
    networks:
      - aravanta

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks:
      - aravanta

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - aravanta

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.106.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../monitoring/otel-collector/config.yml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger
    networks:
      - aravanta

volumes:
  postgres_data:

networks:
  aravanta:
