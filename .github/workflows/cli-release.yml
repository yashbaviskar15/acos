name: Aravanta CLI Release & Cross-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Native CLI Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: aravanta-linux-amd64
            binary_name: aravanta
          - os: windows-latest
            artifact_name: aravanta-windows-amd64.exe
            binary_name: aravanta.exe
          - os: macos-latest
            artifact_name: aravanta-darwin-amd64
            binary_name: aravanta

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Standalone Executable (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --onefile --name aravanta cli/aravanta.py
          Move-Item dist\aravanta.exe dist\${{ matrix.artifact_name }}

      - name: Build Standalone Executable (POSIX)
        if: matrix.os != 'windows-latest'
        run: |
          pyinstaller --onefile --name aravanta cli/aravanta.py
          mv dist/aravanta dist/${{ matrix.artifact_name }}
          chmod +x dist/${{ matrix.artifact_name }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  publish-release:
    name: Publish Standalone CLI Release
    needs: build-binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-binaries/*/*
          generate_release_notes: true
