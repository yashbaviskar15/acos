events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    limit_req_zone $binary_remote_addr zone=api_ratelimit:10m rate=30r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream frontend_service {
        server frontend:80;
    }

    upstream arvgate_service {
        server arvgate:8000;
    }

    upstream arvcompute_service {
        server arvcompute:8000;
    }

    upstream arvkube_service {
        server arvkube:8000;
    }

    upstream arvstore_service {
        server arvstore:8000;
    }

    upstream arvdb_service {
        server arvdb:8000;
    }

    upstream arvregistry_service {
        server arvregistry:8000;
    }

    upstream arvedge_service {
        server arvedge:8000;
    }

    upstream arvwatch_service {
        server arvwatch:8000;
    }

    upstream arvcicd_service {
        server arvcicd:8000;
    }

    upstream arvbilling_service {
        server arvbilling:8000;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        location /api/v1/auth/ {
            limit_req zone=api_ratelimit burst=60 nodelay;
            proxy_pass http://arvgate_service;
        }

        location /api/v1/compute/ {
            limit_req zone=api_ratelimit burst=60 nodelay;
            proxy_pass http://arvcompute_service;
        }

        location /api/v1/kubernetes/ {
            limit_req zone=api_ratelimit burst=60 nodelay;
            proxy_pass http://arvkube_service;
        }

        location /api/v1/storage/ {
            limit_req zone=api_ratelimit burst=60 nodelay;
            proxy_pass http://arvstore_service;
        }

        location /api/v1/database/ {
            limit_req zone=api_ratelimit burst=60 nodelay;
            proxy_pass http://arvdb_service;
        }

        location /api/v1/registry/ {
            limit_req zone=api_ratelimit burst=60 nodelay;
            proxy_pass http://arvregistry_service;
        }

        location /api/v1/edge/ {
            limit_req zone=api_ratelimit burst=60 nodelay;
            proxy_pass http://arvedge_service;
        }

        location /api/v1/monitoring/ {
            limit_req zone=api_ratelimit burst=60 nodelay;
            proxy_pass http://arvwatch_service;
        }

        location /api/v1/cicd/ {
            limit_req zone=api_ratelimit burst=60 nodelay;
            proxy_pass http://arvcicd_service;
        }

        location /api/v1/billing/ {
            limit_req zone=api_ratelimit burst=60 nodelay;
            proxy_pass http://arvbilling_service;
        }

        location = /docs/arvgate {
            proxy_pass http://arvgate_service/docs;
        }

        location = /docs/arvcompute {
            proxy_pass http://arvcompute_service/docs;
        }

        location = /docs/arvkube {
            proxy_pass http://arvkube_service/docs;
        }

        location = /docs/arvwatch {
            proxy_pass http://arvwatch_service/docs;
        }

        location / {
            proxy_pass http://frontend_service;
        }
    }
}
