global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: aravanta-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - arvgate:8000
          - arvcompute:8000
          - arvkube:8000
          - arvstore:8000
          - arvdb:8000
          - arvregistry:8000
          - arvedge:8000
          - arvwatch:8000
          - arvcicd:8000
          - arvbilling:8000
